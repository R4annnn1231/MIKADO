<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profil Akun - MIKAdO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background: linear-gradient(rgba(88, 28, 135, 0.9), rgba(126, 34, 206, 0.9)), url("{{ url_for('static', filename='background.jpg') }}") !important; 
            background-size: cover; background-attachment: fixed; min-height: 100vh; display: flex; align-items: center; justify-content: center; 
        }
        .glass-card { background: rgba(255, 255, 255, 0.95); border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); padding: 40px; width: 100%; max-width: 500px; }
        .bg-ungu { background-color: #6f42c1 !important; color: white !important; }
        .btn-ungu { background-color: #581c87; color: white; border: none; font-weight: 500; }
        .btn-ungu:hover { background-color: #4c1d95; color: white; }
    </style>
</head>
<body>
    <div class="glass-card">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-dark">⚙️ Pengaturan Profil</h3>
            <p class="text-muted">Perbarui Username atau Password Anda</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} text-center fw-bold">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('profil') }}">
            <div class="mb-3">
                <label class="form-label fw-bold text-secondary">Username Baru</label>
                <input type="text" class="form-control" name="username" value="{{ username }}" required>
            </div>
            
            <hr class="my-4">
            
            <div class="mb-3">
                <label class="form-label fw-bold text-secondary">Password Lama (Wajib)</label>
                <input type="password" class="form-control" name="password_lama" required placeholder="Masukkan password saat ini...">
                <small class="text-muted">Diperlukan untuk memvalidasi perubahan.</small>
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-bold text-secondary">Password Baru (Opsional)</label>
                <input type="password" class="form-control" name="password_baru" placeholder="Kosongkan jika tidak ingin mengubah password...">
            </div>

            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-ungu py-2">Simpan Perubahan</button>
                <a href="{{ url_for('index') }}" class="btn btn-secondary py-2">Kembali ke Dashboard</a>
            </div>
        </form>
    </div>
</body>
</html>

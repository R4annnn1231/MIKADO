<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - MIKAdO</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #e0c3fc; 
            /* Memanggil gambar dari folder static */
            background-image: linear-gradient(135deg, rgba(74, 20, 140, 0.88), rgba(156, 39, 176, 0.88)), url("{{ url_for('static', filename='background.jpg') }}"); 
            background-size: cover; 
            background-attachment: fixed; 
            background-blend-mode: multiply; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .glass-card { 
            background: rgba(255, 255, 255, 0.92); 
            backdrop-filter: blur(12px); 
            border-radius: 15px; 
            border: 1px solid rgba(255, 255, 255, 0.3); 
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2); 
            padding: 40px; 
            width: 100%; 
            max-width: 400px; 
        }
        .btn-custom { 
            background: linear-gradient(135deg, #6a1b9a, #8e24aa); 
            color: white; 
            border: none; 
            font-weight: bold; 
            padding: 12px; 
            border-radius: 8px; 
            width: 100%;
            transition: 0.3s; 
        }
        .btn-custom:hover { 
            background: linear-gradient(135deg, #4a148c, #7b1fa2); 
            color: white; 
            transform: translateY(-2px); 
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <div class="text-center mb-4">
            <h3 class="fw-bold text-dark">✨ MIK<i>AdO</i></h3>
            <p class="text-muted">Pemantauan Kesehatan Anak</p>
        </div>
        
        <!-- Menampilkan pesan error/sukses dari app.py -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ category }} text-center p-2">{{ message }}</div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <!-- action tidak perlu diisi, otomatis ke route /login -->
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold text-secondary">Username</label>
                <input type="text" class="form-control" name="username" required placeholder="Masukkan username admin/ortu...">
            </div>
            <div class="mb-4">
                <label class="form-label fw-bold text-secondary">Password</label>
                <div class="input-group">
                    <input type="password" class="form-control" name="password" id="passwordLogin" required placeholder="Masukkan password...">
                    <button class="btn btn-outline-secondary bg-white" type="button" onclick="togglePassword('passwordLogin')">👁️</button>
                </div>
            </div>
            <button type="submit" class="btn btn-custom">Masuk ke Sistem</button>
            <div class="text-center mt-3">
                <!-- Link diubah menggunakan url_for -->
                <small class="text-muted">Belum punya akun? <a href="{{ url_for('register') }}" class="text-decoration-none fw-bold text-primary">Daftar di sini</a></small>
            </div>
        </form>
    </div>
    
    <script>
        function togglePassword(inputId) {
            const input = document.getElementById(inputId);
            input.type = input.type === "password" ? "text" : "password";
        }
    </script>
</body>
</html>
